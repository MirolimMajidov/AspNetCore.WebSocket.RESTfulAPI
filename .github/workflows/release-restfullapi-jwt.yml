name: Release the AspNetCore.WebSocket.RESTfulAPI.JWT package

on:
  workflow_dispatch:  # Allows the workflow to be triggered manually

permissions:
  contents: write  # Grant the workflow permission to push to the repository
  id-token: write  # Allow NuGet/login to request a GitHub OIDC token

jobs:
  Versioning:
    uses: ./.github/workflows/service-versioning.yml
    with:
      project_file_path: "src/AspNetCore.WebSocket.RESTfulAPI.JWT/AspNetCore.WebSocket.RESTfulAPI.JWT.csproj"
      should_add_version_tag: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit
  
  Release:
    needs: Versioning
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies and build the project
        run: |
          dotnet restore src/AspNetCore.WebSocket.RESTfulAPI.JWT/AspNetCore.WebSocket.RESTfulAPI.JWT.csproj
          dotnet build src/AspNetCore.WebSocket.RESTfulAPI.JWT/AspNetCore.WebSocket.RESTfulAPI.JWT.csproj --configuration Release

      - name: Pack the NuGet package
        run: dotnet pack src/AspNetCore.WebSocket.RESTfulAPI.JWT/AspNetCore.WebSocket.RESTfulAPI.JWT.csproj --configuration Release --output ./nupkgs -p:Version="${{ needs.Versioning.outputs.version }}"

      - name: Log in to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mirolimmajidov

      - name: Push the package to NuGet.org
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Generate release notes
        run: |
          echo "## Release notes of AspNetCore.WebSocket.RESTfulAPI.JWT library 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- NuGet package name: **AspNetCore.WebSocket.RESTfulAPI.JWT**" >> $GITHUB_STEP_SUMMARY
          echo "- New version: **${{ needs.Versioning.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
